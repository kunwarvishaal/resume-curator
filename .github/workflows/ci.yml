name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install (exact versions from package-lock.json)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm run audit:prod

  cv-tool:
    # The Python CV formatter in tools/cv-format. CI can test the Word file only:
    # the PDF step needs Microsoft Word, which Linux runners don't have.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/cv-format
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/cv-format/requirements.txt
      - name: Install (exact versions from requirements.txt)
        run: pip install -r requirements.txt pip-audit
      - name: Test
        run: python -m unittest test_build_cv.py
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
